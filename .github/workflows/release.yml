name: Auto Release on Version Bump

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger for testing

permissions:
  contents: write

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need previous commit to compare

      - name: Check for version change
        id: version
        run: |
          # Get current version from pyproject.toml
          CURRENT=$(grep -m1 'version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          
          # Get previous version
          git show HEAD~1:pyproject.toml > /tmp/old_pyproject.toml 2>/dev/null || echo 'version = "0.0.0"' > /tmp/old_pyproject.toml
          PREVIOUS=$(grep -m1 'version = ' /tmp/old_pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "previous=$PREVIOUS" >> $GITHUB_OUTPUT
          
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version changed: $PREVIOUS -> $CURRENT"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No version change detected"
          fi

      - name: Generate release notes
        if: steps.version.outputs.changed == 'true'
        id: notes
        run: |
          VERSION=${{ steps.version.outputs.current }}
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          # Get commits since last tag (or all if no tags)
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges | grep -v "chore: bump version")
          else
            COMMITS=$(git log --pretty=format:"- %s" --no-merges -20 | grep -v "chore: bump version")
          fi
          
          # Write release notes to file (handles multiline)
          cat << EOF > release_notes.md
          ## What's Changed
          
          $COMMITS
          
          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG:-initial}...${VERSION}
          EOF

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.current }}
          name: v${{ steps.version.outputs.current }}
          body_path: release_notes.md
          generate_release_notes: false
